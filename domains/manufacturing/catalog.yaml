# 원인 카탈로그 — 합성 티켓의 정답(root_cause) 원천.
# 규칙: LLM은 이 파일을 절대 쓰지 않는다. symptom/action_log/resolution_note만 생성한다.
# 알람 코드(E-xxxx)와 설비 ID는 가상 체계다. 실제 장비의 파트 번호·코드가 아니다.
# 구조: 서브시스템 × 고장 메커니즘 (FMEA: 고장모드 → 원인 → 영향 → 검출)
# confusable_with: 증상이 겹쳐 검색이 헷갈릴 수 있는 원인 — 의도된 난이도

equipment_types:
  PECVD:  {name: "플라즈마 CVD 증착기", id_range: [1, 12]}
  ETCH:   {name: "건식 식각기",          id_range: [1, 12]}
  PVD:    {name: "스퍼터 증착기",        id_range: [1, 8]}
  PHOTO:  {name: "포토 트랙/스캐너",     id_range: [1, 8]}
  CMP:    {name: "화학기계연마기",       id_range: [1, 8]}

