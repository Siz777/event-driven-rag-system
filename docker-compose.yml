# 전체 경로: slack(Socket Mode) 또는 api(웹훅) → rabbitmq → worker(bge-m3 + qdrant + LLM) → ai_results → slack(스레드 답글).  redis는 멱등성 키.
#   docker compose up --build -d
#   docker compose run --rm worker python -m rag.index     # 최초 1회: 티켓을 qdrant 서비스에 적재
# .env의 LLM_*·SLACK_SIGNING_SECRET·SLACK_BOT_TOKEN·SLACK_APP_TOKEN을 그대로 쓴다. *_URL은 아래 environment가 서비스명으로 덮어쓴다.
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports: ["5672:5672", "15672:15672"]
    volumes: ["rabbitmq_data:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: ["qdrant_data:/qdrant/storage"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: { context: ., dockerfile: Dockerfile.api }
    ports: ["8000:8000"]
    env_file: .env
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}   # 셸 변수가 있으면 .env보다 우선 (테스트용)
    depends_on:
      rabbitmq: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: Dockerfile.worker }
    init: true                   # tini가 PID 1: SIGTERM을 python에 전달, 좀비 회수
    stop_grace_period: 150s      # drain 120s + 여유. 넘으면 SIGKILL
    env_file: .env
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      JUDGE_BASE_URL: ""         # 로컬 Ollama는 컨테이너에서 안 보임. 워커는 심판을 쓰지 않는다
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface   # bge-m3 가중치(호스트 캐시 재사용)
      - ./domains:/app/domains:ro                       # 카탈로그·프롬프트·티켓 jsonl(gitignore)
    depends_on:
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      qdrant: { condition: service_healthy }

  slack:
    build: { context: ., dockerfile: Dockerfile.slack }
    init: true
    env_file: .env
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0   # "검색 중…" 메시지 ts(progress:{event_id}, 1h) — 답을 chat.update로
    depends_on:
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  qdrant_data:
  rabbitmq_data:
  redis_data:
