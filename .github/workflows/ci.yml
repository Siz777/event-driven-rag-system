name: ci

# 유닛 테스트 + 평가 게이트(기록값). 통합 테스트(RabbitMQ·Redis)는 marker로 제외, LLM 호출 0.
# 티켓 데이터·색인·bge-m3는 저장소에 없어 검색 재실행(--mode live)은 로컬 pre-push에서 돌린다 — README "평가 게이트".
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GRAPH_TOOLS: "0"
      HF_HUB_OFFLINE: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-worker.txt
      - name: Install (CPU torch pinned, same constraints as the worker image)
        run: |
          pip install --no-cache-dir torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -c constraints-worker.txt -r requirements.txt
      - name: Unit tests (integration marker excluded)
        run: python -m pytest -m "not integration" -q -p no:cacheprovider
      - name: Evaluation gate (recorded metrics + reranker manifest)
        run: python -m scripts.eval_gate --mode recorded --no-log
